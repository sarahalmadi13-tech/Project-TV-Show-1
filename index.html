<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Sarah</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>

    
    <div id="showsView">
      <input type="text" id="showSearch" placeholder="Search shows..." />
      <div id="showsContainer"></div>
    </div>

    <div id="episodesView" style="display:none;">
    <button id="backToShows">← Back to all shows</button>

    <div id="controls">
      <select id="showSelector">
        <option value="">Select a show...</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search episodes..." />

      <select id="episodeSelector">
        <option value="">Select an episode...</option>
      </select>
      <p id="matchCount"></p>
    </div>

    <div id="root"></div>

    <footer>
      <p>Data from <a href="https://tvmaze.com/">TVMaze.com</a></p>
    </footer>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
